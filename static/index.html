<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像处理服务 - 文档扫描与矫正</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f0f5;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8e9ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 14px;
            color: #666;
        }

        .options-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .options-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-item label {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .rotation-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rotation-control select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        .result-section {
            display: none;
            margin-top: 30px;
        }

        .result-section.active {
            display: block;
        }

        .comparison-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .comparison-container {
                grid-template-columns: 1fr;
            }
        }

        .image-panel {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: #f8f9fa;
        }

        .image-panel-header {
            background: #667eea;
            color: white;
            padding: 12px;
            font-weight: bold;
            text-align: center;
        }

        .image-panel-body {
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        .image-panel img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .metadata-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .metadata-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .metadata-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .metadata-item {
            padding: 12px;
            background: white;
            border-radius: 4px;
            border-left: 4px solid #667eea;
        }

        .metadata-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .metadata-value {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .actions-section {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #f5c6cb;
        }

        .error-message.active {
            display: block;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 图像处理服务</h1>
            <p>文档扫描 · 透视矫正 · 倾斜修正 · 方向识别</p>
        </div>

        <div class="main-content">
            <div class="error-message" id="errorMessage"></div>

            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <div class="upload-text">点击或拖拽上传图片</div>
                    <div class="upload-hint">支持 JPG, PNG, BMP, TIFF, WebP（最大10MB）</div>
                </div>
                <input type="file" id="fileInput" accept="image/*" class="hidden">
            </div>

            <div class="options-section">
                <div class="options-title">⚙️ 处理选项</div>
                <div class="options-grid">
                    <div class="option-item">
                        <label>
                            <input type="checkbox" id="detectDocument" checked>
                            <span>检测文档边界</span>
                        </label>
                    </div>
                    <div class="option-item">
                        <label>
                            <input type="checkbox" id="deskew" checked>
                            <span>去除倾斜</span>
                        </label>
                    </div>
                    <div class="option-item">
                        <label>
                            <input type="checkbox" id="fixOrientation" checked>
                            <span>方向矫正</span>
                        </label>
                    </div>
                    <div class="option-item">
                        <label>
                            <input type="checkbox" id="trimBorders" checked>
                            <span>裁剪黑边</span>
                        </label>
                    </div>
                    <div class="option-item rotation-control">
                        <label for="manualRotation">手动旋转:</label>
                        <select id="manualRotation">
                            <option value="0">0°</option>
                            <option value="90">90°</option>
                            <option value="180">180°</option>
                            <option value="270">270°</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>处理中，请稍候...</div>
            </div>

            <div class="result-section" id="resultSection">
                <div class="comparison-container">
                    <div class="image-panel">
                        <div class="image-panel-header">原始图片（绿框为检测到的纸张边界）</div>
                        <div class="image-panel-body">
                            <img id="originalImage" src="" alt="原始图片">
                        </div>
                    </div>
                    <div class="image-panel">
                        <div class="image-panel-header">处理后</div>
                        <div class="image-panel-body">
                            <img id="processedImage" src="" alt="处理后图片">
                        </div>
                    </div>
                </div>

                <div class="metadata-section">
                    <div class="metadata-title">📊 处理信息</div>
                    <div class="metadata-grid" id="metadataGrid"></div>
                </div>

                <div class="actions-section">
                    <button class="btn btn-primary" id="downloadBtn">💾 下载处理后的图片</button>
                    <button class="btn btn-secondary" id="resetBtn">🔄 重新上传</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');
        const errorMessage = document.getElementById('errorMessage');
        const originalImage = document.getElementById('originalImage');
        const processedImage = document.getElementById('processedImage');
        const metadataGrid = document.getElementById('metadataGrid');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');

        let processedImageBlob = null;

        // 上传区域点击事件
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择事件
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // 拖拽事件
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            } else {
                showError('请上传图片文件');
            }
        });

        // 处理文件上传
        async function handleFile(file) {
            // 检查文件大小
            if (file.size > 10 * 1024 * 1024) {
                showError('文件大小不能超过10MB');
                return;
            }

            // 显示原始图片
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);

            // 隐藏错误和结果
            hideError();
            resultSection.classList.remove('active');

            // 构建表单数据
            const formData = new FormData();
            formData.append('file', file);
            formData.append('detect_document', document.getElementById('detectDocument').checked);
            formData.append('deskew', document.getElementById('deskew').checked);
            formData.append('fix_orientation', document.getElementById('fixOrientation').checked);
            formData.append('trim_borders', document.getElementById('trimBorders').checked);
            formData.append('manual_rotation', document.getElementById('manualRotation').value);
            // 请求调试图：原图上标出检测到的纸张边界，也解决浏览器无法预览 TIFF 原图的问题
            formData.append('debug', 'true');

            // 显示加载动画
            loading.classList.add('active');

            try {
                // 调用API
                const response = await fetch('/api/v1/process/json', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    let detail = '处理失败 (HTTP ' + response.status + ')';
                    try {
                        const errorData = await response.json();
                        if (errorData.detail) detail = errorData.detail;
                    } catch (e) { /* 非 JSON 错误响应（如代理返回的 413） */ }
                    throw new Error(detail);
                }

                const data = await response.json();

                // base64 转 Blob，供显示和下载
                processedImageBlob = base64ToBlob(data.image, data.mime_type || 'image/jpeg');
                if (processedImage.src.startsWith('blob:')) URL.revokeObjectURL(processedImage.src);
                processedImage.src = URL.createObjectURL(processedImageBlob);

                if (data.debug_image) {
                    originalImage.src = 'data:image/jpeg;base64,' + data.debug_image;
                }

                displayMetadata(data.metadata || {});

                // 显示结果
                resultSection.classList.add('active');

            } catch (error) {
                showError(error.message);
            } finally {
                loading.classList.remove('active');
            }
        }

        // 显示元数据
        function displayMetadata(metadata) {
            metadataGrid.innerHTML = '';

            const items = [
                {
                    label: '原始尺寸',
                    value: metadata.original_size ? `${metadata.original_size[0]} × ${metadata.original_size[1]}` : 'N/A'
                },
                {
                    label: '处理后尺寸',
                    value: metadata.processed_size ? `${metadata.processed_size[0]} × ${metadata.processed_size[1]}` : 'N/A'
                },
                {
                    label: '旋转角度',
                    value: `${metadata.rotation_applied || 0}°`
                },
                {
                    label: '倾斜角度',
                    value: metadata.deskew_angle ? `${metadata.deskew_angle.toFixed(2)}°` : '0°'
                },
                {
                    label: '处理耗时',
                    value: metadata.processing_time_ms ? `${metadata.processing_time_ms.toFixed(1)} ms` : 'N/A'
                },
                {
                    label: '检测到文档',
                    value: metadata.detected_quad ? '是' : '否'
                },
                {
                    label: '方向置信度',
                    value: metadata.orientation_confidence != null ? metadata.orientation_confidence.toFixed(2) : 'N/A'
                },
                {
                    label: '执行步骤',
                    value: metadata.steps && metadata.steps.length ? metadata.steps.join(' → ') : '无'
                }
            ];

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'metadata-item';
                div.innerHTML = `
                    <div class="metadata-label">${item.label}</div>
                    <div class="metadata-value">${item.value}</div>
                `;
                metadataGrid.appendChild(div);
            });
        }

        // 下载按钮
        downloadBtn.addEventListener('click', () => {
            if (!processedImageBlob) return;

            const url = URL.createObjectURL(processedImageBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `processed_${Date.now()}.${processedImageBlob.type === 'image/png' ? 'png' : 'jpg'}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // 重置按钮
        resetBtn.addEventListener('click', () => {
            fileInput.value = '';
            resultSection.classList.remove('active');
            hideError();
            processedImageBlob = null;
        });

        function base64ToBlob(b64, mime) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new Blob([bytes], { type: mime });
        }

        // 显示错误
        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.classList.add('active');
        }

        // 隐藏错误
        function hideError() {
            errorMessage.classList.remove('active');
        }
    </script>
</body>
</html>
